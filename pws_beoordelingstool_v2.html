<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PWS Tool — Sophianum VWO 2026–2027</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f0f4f8;color:#1e293b;min-height:100vh}
button,input,textarea,select{font-family:inherit}

/* TOPBAR */
.topbar{background:linear-gradient(135deg,#1e3a5f,#16305a);color:#fff;padding:0 24px;display:flex;align-items:stretch;gap:0;position:sticky;top:0;z-index:50;box-shadow:0 2px 16px rgba(0,0,0,.18)}
.topbar-logo{background:#fff;display:flex;align-items:center;padding:8px 16px 8px 0;margin-right:18px;border-right:1px solid rgba(255,255,255,.12)}
.topbar-logo img{height:40px;width:auto}
.topbar-text{display:flex;flex-direction:column;justify-content:center;padding:11px 0}
.topbar-title{font-size:17px;font-weight:800;letter-spacing:-.3px}
.topbar-school{font-size:12px;opacity:.8;font-style:italic;margin-top:1px}
.topbar-sub{font-size:11px;opacity:.55;margin-top:1px}
.topbar-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.rainbow-bar{height:4px;background:linear-gradient(90deg,#e63946,#f4a261,#e9c46a,#2a9d8f,#457b9d,#6a0572);flex-shrink:0}

/* LAYOUT */
#app{display:flex;flex-direction:column;min-height:100vh}
.main{flex:1;max-width:900px;margin:0 auto;width:100%;padding:24px 18px 60px}

/* BUTTONS */
.btn{padding:8px 16px;border-radius:8px;border:none;font-size:13px;font-weight:700;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:#1e3a5f;color:#fff}
.btn-ghost{background:rgba(255,255,255,.15);color:#fff}
.btn-white{background:#fff;color:#1e3a5f}
.btn-danger{background:#fee2e2;color:#991b1b}
.btn-sm{padding:6px 13px;font-size:12px;border-radius:7px}
.btn-outline{background:none;border:1.5px solid #e2e8f0;color:#475569;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.btn-outline:hover{border-color:#1e3a5f;color:#1e3a5f}

/* CARDS */
.card{background:#fff;border:1.5px solid #e2e8f0;border-radius:13px;padding:18px 22px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:#1e3a5f;box-shadow:0 3px 14px rgba(30,58,95,.09)}
.card-title{font-weight:700;font-size:15px;color:#1e3a5f}
.card-meta{font-size:13px;color:#64748b;margin-top:2px}
.progress-bar{height:5px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:#1e3a5f;border-radius:99px;transition:width .3s}

/* TABS */
.tabs{display:flex;gap:2px;border-bottom:2px solid #e2e8f0;margin-bottom:22px;overflow-x:auto}
.tab-btn{padding:9px 18px;background:none;border:none;border-bottom:3px solid transparent;color:#64748b;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;margin-bottom:-2px;transition:color .15s}
.tab-btn.active{border-bottom-color:#1e3a5f;color:#1e3a5f;font-weight:700}

/* DETAIL HEADER */
.detail-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:20px}
.back-btn{background:none;border:none;color:#64748b;font-size:22px;padding:4px 8px 4px 0;cursor:pointer;flex-shrink:0}
.detail-title{font-size:21px;font-weight:900;color:#1e3a5f}
.detail-meta{font-size:13px;color:#64748b;margin-top:3px}
.detail-cijfer{font-size:46px;font-weight:900;line-height:1}

/* LOGBOEK */
.fase-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#94a3b8;margin:24px 0 10px}
.mijlpaal-block{border:1.5px solid #e2e8f0;border-radius:12px;margin-bottom:10px;overflow:hidden;transition:border-color .15s}
.mijlpaal-block.open{border-color:var(--mc)}
.mijlpaal-header{display:flex;align-items:center;gap:12px;padding:13px 18px;cursor:pointer;background:#fff;user-select:none}
.mijlpaal-block.open .mijlpaal-header{background:#f8fafc}
.mijlpaal-dot{width:12px;height:12px;border-radius:50%;background:var(--mc);flex-shrink:0}
.mijlpaal-datum{font-size:11px;color:#94a3b8;white-space:nowrap}
.mijlpaal-name{font-weight:700;font-size:14px;color:#1e3a5f;flex:1}
.mijlpaal-progress{font-size:12px;color:#94a3b8}
.mijlpaal-check{font-size:16px}
.mijlpaal-body{padding:6px 18px 18px;background:#fff;display:none}
.mijlpaal-block.open .mijlpaal-body{display:block}
.mijlpaal-desc{font-size:12px;color:#64748b;background:#f8fafc;border-radius:8px;padding:9px 12px;margin:10px 0 14px;line-height:1.5}

/* VRAGEN */
.vraag-block{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #f1f5f9}
.vraag-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.vraag-tekst{font-size:13px;font-weight:600;color:#334155;margin-bottom:8px;display:flex;align-items:flex-start;gap:6px}
.rubric-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.rubric-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;background:#e0f2fe;color:#0369a1}
.bool-row{display:flex;gap:8px}
.bool-btn{flex:1;padding:8px;border-radius:8px;border:1.5px solid #e2e8f0;background:#f8fafc;color:#374151;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;text-align:center}
.bool-btn.ja.selected{background:#dcfce7;border-color:#16a34a;color:#15803d}
.bool-btn.nee.selected{background:#fee2e2;border-color:#dc2626;color:#b91c1c}
.bool-btn:not(.selected):hover{border-color:#94a3b8}
.text-input{width:100%;padding:9px 12px;border-radius:8px;border:1.5px solid #e2e8f0;font-size:13px;color:#334155;background:#f8fafc;resize:vertical;min-height:64px}
.text-input:focus{outline:none;border-color:#1e3a5f}

/* LOGBOEK SAMENVATTING sidebar per criterium */
.logboek-hint{background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px;padding:10px 13px;margin-bottom:16px;font-size:12px;color:#0369a1;line-height:1.5}
.logboek-hint strong{display:block;margin-bottom:4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em}

/* CRITERIUM ACCORDION */
.crit-block{border:1.5px solid #e2e8f0;border-radius:12px;margin-bottom:10px;overflow:hidden}
.crit-block.open{border-color:#1e3a5f}
.crit-header{display:flex;align-items:center;gap:10px;padding:13px 18px;cursor:pointer;background:#fff;user-select:none}
.crit-block.open .crit-header{background:#f0f4ff}
.crit-label{font-weight:700;font-size:14px;color:#1e3a5f}
.crit-weging{font-size:12px;color:#94a3b8;margin-left:4px}
.crit-header-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.crit-pill{font-size:12px;font-weight:800;padding:3px 10px;border-radius:20px}
.crit-body{padding:6px 18px 18px;background:#fff;display:none}
.crit-block.open .crit-body{display:block}
.stelling{margin-top:14px;padding-top:14px;border-top:1px solid #f1f5f9}
.stelling:first-child{margin-top:8px;padding-top:8px;border-top:none}
.stelling-vraag{font-size:13px;font-weight:600;color:#334155;margin-bottom:8px}
.opties{display:flex;gap:6px;flex-wrap:wrap}
.optie-btn{flex:1;min-width:110px;padding:8px 5px;border-radius:8px;border:2px solid #e2e8f0;background:#f8fafc;color:#374151;font-size:11px;line-height:1.35;text-align:center;cursor:pointer;transition:all .15s}
.optie-btn .niv{display:block;font-size:10px;font-weight:700;opacity:.5;margin-bottom:2px}
.optie-btn.selected{color:#fff}
.optie-btn.selected .niv{opacity:1}
.n4.selected{background:#1a6b3c;border-color:#1a6b3c}
.n3.selected{background:#3a9e5e;border-color:#3a9e5e}
.n2.selected{background:#e07b2a;border-color:#e07b2a}
.n1.selected{background:#c0392b;border-color:#c0392b}
.n4:not(.selected):hover{border-color:#1a6b3c;color:#1a6b3c}
.n3:not(.selected):hover{border-color:#3a9e5e;color:#3a9e5e}
.n2:not(.selected):hover{border-color:#e07b2a;color:#e07b2a}
.n1:not(.selected):hover{border-color:#c0392b;color:#c0392b}
.crit-summary{margin-top:12px;padding:9px 13px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.opmerking-label{font-size:12px;font-weight:600;color:#64748b;margin-top:14px;margin-bottom:5px}
.opmerking-input{width:100%;min-height:64px;padding:9px 12px;border-radius:8px;border:1px solid #e2e8f0;background:#f8fafc;font-size:13px;color:#334155;resize:vertical}
.opmerking-input:focus{outline:none;border-color:#1e3a5f}

/* EINDSCORE */
.eindscore-box{border-radius:14px;padding:26px;text-align:center;margin-bottom:22px;border:2px solid #e2e8f0}
.eindscore-box.compleet{background:#f0fdf4;border-color:#1a6b3c}
.eindscore-getal{font-size:68px;font-weight:900;line-height:1}
.score-table{width:100%;border-collapse:collapse;font-size:13px}
.score-table th{text-align:left;padding:7px 8px;color:#64748b;font-weight:600;border-bottom:2px solid #e2e8f0}
.score-table th:not(:first-child){text-align:center}
.score-table th:last-child{text-align:right}
.score-table td{padding:9px 8px;border-bottom:1px solid #f1f5f9}
.score-table td:not(:first-child){text-align:center}
.score-table td:last-child{text-align:right;font-weight:700}
.score-table tr.totaal td{border-top:2px solid #1e3a5f;background:#f8fafc;font-weight:700}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:#fff;border-radius:16px;padding:28px 30px;width:460px;max-width:95vw;box-shadow:0 24px 60px rgba(0,0,0,.18)}
.modal h2{font-size:18px;font-weight:800;color:#1e3a5f;margin-bottom:18px}
.field-label{font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:4px;margin-top:12px}
.field-input{width:100%;padding:9px 12px;border-radius:8px;border:1.5px solid #e2e8f0;font-size:13px;color:#1e293b}
.field-input:focus{outline:none;border-color:#1e3a5f}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

/* EMPTY */
.empty{text-align:center;padding:70px 0;color:#94a3b8}
.empty .icon{font-size:48px;margin-bottom:14px}

/* DELETE */
.delete-btn{background:none;border:1px solid #fecaca;border-radius:7px;color:#f87171;font-size:13px;padding:5px 10px;cursor:pointer;transition:all .15s}
.delete-btn:hover{background:#fee2e2;border-color:#f87171;color:#dc2626}

/* SEARCH */
.search-input{width:100%;padding:10px 14px;border-radius:10px;border:1.5px solid #e2e8f0;font-size:14px;background:#fff;color:#1e293b}
.search-input:focus{outline:none;border-color:#1e3a5f}

/* LOGBOEK VOORTGANGSBALK */
.logboek-overview{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.logboek-badge{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;border:1.5px solid}


  /* SCHAALVRAGEN */
  .scale-opties{display:flex;flex-direction:column;gap:6px;margin-top:4px}
  .scale-btn{
    padding:9px 14px;border-radius:8px;border:1.5px solid #e2e8f0;
    background:#f8fafc;color:#374151;font-size:12px;
    text-align:left;cursor:pointer;transition:all .15s;
    display:flex;align-items:center;gap:10px;line-height:1.4
  }
  .scale-btn .scale-nr{
    flex-shrink:0;width:24px;height:24px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;background:#e2e8f0;color:#64748b
  }
  .scale-btn:hover{border-color:#94a3b8}
  .scale-btn.s1{} .scale-btn.s2{} .scale-btn.s3{} .scale-btn.s4{}
  /* s4=Uitstekend(groen), s3=Goed, s2=Matig, s1=Onvoldoende(rood) */
  .scale-btn.s4.selected{background:#ecfdf5;border-color:#1a6b3c;color:#0f5530}
  .scale-btn.s4.selected .scale-nr{background:#1a6b3c;color:#fff}
  .scale-btn.s3.selected{background:#f0fdf4;border-color:#3a9e5e;color:#1f7a42}
  .scale-btn.s3.selected .scale-nr{background:#3a9e5e;color:#fff}
  .scale-btn.s2.selected{background:#fff3e0;border-color:#e07b2a;color:#c0620f}
  .scale-btn.s2.selected .scale-nr{background:#e07b2a;color:#fff}
  .scale-btn.s1.selected{background:#fee2e2;border-color:#c0392b;color:#c0392b}
  .scale-btn.s1.selected .scale-nr{background:#c0392b;color:#fff}

  /* PRESENTATIERUBRIC TAB */
  .pres-crit{border:1.5px solid #e2e8f0;border-radius:12px;margin-bottom:10px;overflow:hidden}
  .pres-crit.open{border-color:#7c3aed}
  .pres-crit-header{display:flex;align-items:center;gap:10px;padding:13px 18px;cursor:pointer;background:#fff;user-select:none}
  .pres-crit.open .pres-crit-header{background:#faf5ff}
  .pres-crit-body{padding:6px 18px 18px;display:none}
  .pres-crit.open .pres-crit-body{display:block}
  .pres-score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
  .pres-score-btn{
    padding:10px 8px;border-radius:9px;border:2px solid #e2e8f0;
    background:#f8fafc;cursor:pointer;text-align:center;transition:all .15s;font-size:12px;line-height:1.4
  }
  .pres-score-btn .ps-nr{font-size:18px;font-weight:900;display:block;margin-bottom:4px}
  .pres-score-btn .ps-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:4px}
  .pres-score-btn .ps-desc{font-size:11px;color:#64748b;display:block;line-height:1.35}
  .pres-score-btn:hover{border-color:#7c3aed}
  .pres-score-btn.p2.selected{background:#fee2e2;border-color:#c0392b}
  .pres-score-btn.p2.selected .ps-nr{color:#c0392b}
  .pres-score-btn.p4.selected{background:#fff3e0;border-color:#e07b2a}
  .pres-score-btn.p4.selected .ps-nr{color:#e07b2a}
  .pres-score-btn.p6.selected{background:#fff9e6;border-color:#d97706}
  .pres-score-btn.p6.selected .ps-nr{color:#d97706}
  .pres-score-btn.p7.selected{background:#f0fdf4;border-color:#3a9e5e}
  .pres-score-btn.p7.selected .ps-nr{color:#3a9e5e}
  .pres-score-btn.p8.selected{background:#ecfdf5;border-color:#1a6b3c}
  .pres-score-btn.p8.selected .ps-nr{color:#1a6b3c}
  .pres-score-btn.p10.selected{background:#f5f3ff;border-color:#7c3aed}
  .pres-score-btn.p10.selected .ps-nr{color:#7c3aed}
  .pres-totaal{background:#faf5ff;border:1.5px solid #7c3aed;border-radius:12px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;gap:16px}
  .pres-totaal-getal{font-size:48px;font-weight:900;color:#7c3aed;line-height:1}

  /* VERDIEPINGSVRAGEN TAB */
  .vd-categorie{border:1.5px solid #e2e8f0;border-radius:12px;margin-bottom:10px;overflow:hidden}
  .vd-categorie.open{border-color:var(--vc)}
  .vd-cat-header{display:flex;align-items:center;gap:10px;padding:13px 18px;cursor:pointer;background:#fff;user-select:none}
  .vd-categorie.open .vd-cat-header{background:#f8fafc}
  .vd-cat-dot{width:12px;height:12px;border-radius:50%;background:var(--vc);flex-shrink:0}
  .vd-cat-title{font-weight:700;font-size:14px;color:#1e3a5f;flex:1}
  .vd-cat-sub{font-size:12px;color:#94a3b8}
  .vd-cat-body{padding:10px 18px 16px;display:none;background:#fff}
  .vd-categorie.open .vd-cat-body{display:block}
  .vd-vraag{
    padding:10px 14px;margin-bottom:6px;border-radius:8px;
    background:#f8fafc;border:1px solid #e2e8f0;font-size:13px;color:#334155;
    display:flex;align-items:flex-start;gap:10px;cursor:pointer;transition:background .15s
  }
  .vd-vraag:hover{background:#e0f2fe;border-color:#0369a1}
  .vd-vraag.gebruikt{background:#dcfce7;border-color:#16a34a;color:#15803d}
  .vd-vraag-nr{flex-shrink:0;font-weight:700;font-size:11px;color:#94a3b8;margin-top:1px}
  .vd-tip{font-size:12px;color:#64748b;background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px;padding:10px 13px;margin-bottom:14px}

  /* ══ PRINT ══ */
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  body{background:#fff!important;font-size:10pt;margin:0;padding:0}

  /* Verberg alle UI-elementen */
  .topbar,.rainbow-bar,.tabs,.back-btn,.no-print,
  .search-input,.modal-overlay,
  .bool-row,.scale-opties,.opties,
  .crit-arrow,.logboek-hint,.rubric-tags,
  .pres-score-grid,.vd-cat-body,
  button:not(.print-show){display:none!important}

  /* Layout */
  #app{display:block}
  .main{max-width:100%;padding:0 0 20px;margin:0;width:100%}

  /* Print header altijd tonen */
  .print-header{display:block!important;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid #1e3a5f}

  /* Criteria en mijlpalen: altijd uitklappen */
  .crit-block,.pres-crit{
    border:1px solid #ccc!important;border-radius:4px!important;
    margin-bottom:8px!important;page-break-inside:avoid;
  }
  .crit-header,.pres-crit-header{
    background:#f0f4f8!important;padding:7px 12px!important;
  }
  .crit-body,.pres-crit-body{
    display:block!important;padding:6px 12px 10px!important;
  }

  /* Stellingen: toon geselecteerde waarde als tekst */
  .stelling{margin-top:8px!important;padding-top:8px!important}
  .stelling-vraag{font-size:9.5pt!important;font-weight:600!important}

  /* Opmerkingen tonen */
  .opmerking-input,.text-input{
    border:1px solid #ccc!important;background:#fff!important;
    min-height:30px!important;font-size:9pt!important;
    -webkit-appearance:none;resize:none;
  }
  .opmerking-label{font-size:9pt!important;margin-top:6px!important}

  /* Eindscore tabel */
  .eindscore-box{border:2px solid #1e3a5f!important;padding:12px!important;margin-bottom:12px!important}
  .eindscore-getal{font-size:36pt!important}
  .score-table{font-size:9.5pt!important}
  .score-table th,.score-table td{padding:5px 6px!important}

  /* Handtekeningen */
  .handtekening-blok{display:block!important;margin-top:24px!important;page-break-inside:avoid}

  /* Print-only eindscore */
  .print-eindscore{display:block!important;page-break-before:always}

  /* Samenvatting bars verbergen */
  .crit-summary,.pres-totaal{display:none!important}

  /* Paginamarges */
  @page{margin:15mm 15mm 20mm 15mm;size:A4}
}
.print-header,.handtekening-blok,.print-eindscore{display:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ══════════════════════════════════════════════════════════════

const NIVEAUS = ["","Laag","Gemiddeld","Hoog","Excellent"];

function critScore(critId, scores){
  const c=RUBRIC.find(r=>r.id===critId); if(!c) return null;
  const v=c.stellingen.map(s=>scores[s.id]).filter(x=>x!=null);
  if(!v.length) return null;
  return Math.round(((v.reduce((a,b)=>a+b,0)/v.length)-1)/3*60+10);
}
function eindcijfer(scores){
  let g=0,w=0;
  RUBRIC.forEach(c=>{const p=critScore(c.id,scores);if(p!=null){g+=p*c.weging;w+=c.weging;}});
  if(!w) return null;
  return Math.min(10,Math.max(1,((g-10)/60)*9+1)).toFixed(1);
}
function niveauLabel(p){
  if(p>=65)return{label:"Excellent",color:"#1a6b3c"};
  if(p>=55)return{label:"Hoog+",color:"#2d8a50"};
  if(p>=45)return{label:"Hoog",color:"#3a9e5e"};
  if(p>=38)return{label:"Gem.+",color:"#c07a1a"};
  if(p>=28)return{label:"Gemiddeld",color:"#e07b2a"};
  if(p>=18)return{label:"Laag+",color:"#c0392b"};
  return{label:"Laag",color:"#922b21"};
}
function sColor(c){const n=parseFloat(c);return n>=7.5?"#1a6b3c":n>=5.5?"#e07b2a":"#c0392b";}

// Logboek samenvatting per criterium
function logboekSamenvattingVoorCriterium(critId, logboek){
  const relevante = RUBRIC_LOGBOEK_MAP[critId] || [];
  const resultaten = [];
  MIJLPALEN.forEach(m=>{
    m.vragen.forEach(v=>{
      const isRelevant = relevante.some(r=>{
        if(r.endsWith('*')) return v.id.startsWith(r.slice(0,-1));
        return v.id === r;
      });
      if(!isRelevant || v.type==='text') return;
      const val = (logboek[m.id]||{})[v.id];
      if(val===undefined) return;
      resultaten.push({mijlpaal:m.titel, datum:m.datum, vraag:v.tekst, antwoord:val});
    });
  });
  return resultaten;
}

// Storage
function load(){
  try{ return JSON.parse(localStorage.getItem('pws_duos_v2')||'[]'); }catch(e){ return []; }
}
function save(d){localStorage.setItem('pws_duos_v2',JSON.stringify(d))}
function exportData(){
  const blob=new Blob([JSON.stringify({versie:'2.0',exportDatum:new Date().toLocaleDateString('nl-NL'),duos:state.duos},null,2)],{type:'application/json'});
  const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=`pws-alle-duos-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(u);
}
function exportDuo(duo){
  const slug=duo.naam.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const blob=new Blob([JSON.stringify({versie:'2.0',exportDatum:new Date().toLocaleDateString('nl-NL'),duos:[duo]},null,2)],{type:'application/json'});
  const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=`pws-${slug}-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(u);
}
function importData(){
  const i=document.createElement('input');i.type='file';i.accept='.json';
  i.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const p=JSON.parse(ev.target.result);
        const nd=p.duos||[];
        if(!Array.isArray(nd)||!nd.length)throw new Error('Geen duo-data gevonden in dit bestand.');
        const bestaand=new Set(state.duos.map(d=>d.id));
        const nieuw=nd.filter(d=>!bestaand.has(d.id));
        const over=nd.filter(d=>bestaand.has(d.id));
        state.duos=[...state.duos.filter(d=>!over.find(n=>n.id===d.id)),...nd];
        save(state.duos);
        state._importMsg=(nieuw.length?nieuw.length+' nieuw duo'+(nieuw.length>1?'s':'')+' toegevoegd':'')+(nieuw.length&&over.length?' · ':'')+(over.length?over.length+' bestaand duo'+(over.length>1?'s':'')+' bijgewerkt':'');
        render();
      }catch(err){
        state._importMsg='❌ Kan bestand niet inlezen: '+err.message;
        render();
      }
    };r.readAsText(f);
  };i.click();
}

// DOM helper
function el(tag,attrs,...children){
  const e=document.createElement(tag);
  Object.entries(attrs||{}).forEach(([k,v])=>{
    if(k==='className')e.className=v;
    else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else if(k.startsWith('on'))e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='innerHTML')e.innerHTML=v;
    else e.setAttribute(k,v);
  });
  children.flat().forEach(c=>{if(c==null)return;e.appendChild(typeof c==='string'?document.createTextNode(c):c);});
  return e;
}
function txt(s){return document.createTextNode(s);}

function renderLogboek(duo){
  const logboek=duo.logboek||{};

  MIJLPALEN.forEach(m=>{
    // Presentatieavond wordt apart beoordeeld via het Presentatie-tabblad

    }
    // Voortgang deze mijlpaal
    const boolVragen=m.vragen.filter(v=>v.type!=='text');

            className:`bool-btn ${opt}${isSelected?' selected':''}`,

              const val=opt==='ja'?true:false;
              const newVal=cur===val?undefined:val;
              const newLb={...logboek,[m.id]:{...(logboek[m.id]||{}),[v.id]:newVal}};
              if(newVal===undefined)delete newLb[m.id][v.id];
              updateDuo(duo.id,{logboek:newLb});
            }
          },opt==='ja'?'✓ Ja':'✗ Nee');
          row.appendChild(btn);
        });
        vblock.appendChild(row);
      } else if(v.type==='scale'){
        const optsDiv=el('div',{className:'scale-opties'});
        // Score 4=Uitstekend (groen), 3=Goed, 2=Matig, 1=Onvoldoende (rood)
        // schaal[0]=omschrijving score 1, schaal[3]=omschrijving score 4
        // Tonen van hoog naar laag: 4,3,2,1
        const sLabels={4:'Uitstekend',3:'Goed',2:'Matig',1:'Onvoldoende'};
        [4,3,2,1].forEach(score=>{
          const desc=v.schaal[score-1]; // schaal[0]=score1, schaal[3]=score4
          const isSelected=cur===score;
          const btn=el('button',{
            className:`scale-btn s${score}${isSelected?' selected':''}`,
            onClick:()=>{
              const newVal=cur===score?undefined:score;
              const newLb={...logboek,[m.id]:{...(logboek[m.id]||{}),[v.id]:newVal}};
              if(newVal===undefined)delete newLb[m.id][v.id];
              updateDuo(duo.id,{logboek:newLb});
            }
          },
            el('span',{className:'scale-nr'},String(score)),
            el('span',{},`${sLabels[score]}: ${desc}`)
          );
          optsDiv.appendChild(btn);
        });
        vblock.appendChild(optsDiv);
      } else {
        const ta=el('textarea',{className:'text-input',placeholder:'Notities...'});
        ta.value=cur||'';
        ta.addEventListener('input',e=>{
          const d=getActive();if(!d)return;
          const nb={...(d.logboek||{}),[m.id]:{...((d.logboek||{})[m.id]||{}),[v.id]:e.target.value}};
          updateDuoSilent(d.id,{logboek:nb});
        });
        vblock.appendChild(ta);
      }
      body.appendChild(vblock);
    });

    // Ja-ratio samenvatting
    if(ingevuld>0){
      const ratio=Math.round(ingevuld/boolVragen.length*100);
      const positief=boolVragen.filter(v=>{const val=(logboek[m.id]||{})[v.id];return val===true||(typeof val==='number'&&val>=3);}).length;
      const clr=ratio>=80?'#1a6b3c':ratio>=60?'#e07b2a':'#c0392b';
      body.appendChild(el('div',{style:{marginTop:'12px',padding:'9px 13px',background:clr+'12',borderRadius:'8px',border:`1px solid ${clr}30`,fontSize:'12px',display:'flex',justifyContent:'space-between'}},
        el('span',{style:{color:'#64748b'}},`${ingevuld}/${boolVragen.length} vragen ingevuld`),
        el('span',{style:{color:clr,fontWeight:'800'}},`${positief} van ${boolVragen.length} positief (${Math.round(positief/boolVragen.length*100)}%)`)
      ));
    }

    block.appendChild(body);
    wrap.appendChild(block);
  });
  return wrap;
}

// ══ BEOORDELING TAB ══
function renderBeoordeling(duo){
  const scores=duo.scores||{};
  const opmerkingen=duo.opmerkingen||{};
  const logboek=duo.logboek||{};
  const wrap=el('div',{});

  RUBRIC.forEach(crit=>{
    const punten=critScore(crit.id,scores);
    const ingevuld=crit.stellingen.filter(s=>scores[s.id]!=null).length;
    const niv=punten?niveauLabel(punten):null;
    const isOpen=state.openItem===('crit_'+crit.id);

    // Logboek hints voor dit criterium
    const hints=logboekSamenvattingVoorCriterium(crit.id,logboek);
    const positief=hints.filter(h=>h.antwoord===true).length;
    const negatief=hints.filter(h=>h.antwoord===false).length;

    const block=el('div',{className:'crit-block'+(isOpen?' open':'')});
    const header=el('div',{className:'crit-header',onClick:()=>setState({openItem:isOpen?null:('crit_'+crit.id)})},
      el('span',{className:'crit-label'},crit.label),
      el('span',{className:'crit-weging'},`${Math.round(crit.weging*100)}%`),
      el('div',{className:'crit-header-right'},
        hints.length?el('span',{style:{fontSize:'12px',color:'#94a3b8'}},`📋 ${positief}✓ ${negatief}✗`):null,
        el('span',{style:{fontSize:'12px',color:'#94a3b8'}},`${ingevuld}/${crit.stellingen.length}`),
        punten?el('span',{className:'crit-pill',style:{background:niv.color+'18',color:niv.color,border:`1px solid ${niv.color}40`}},`${niv.label} · ${punten}p`):null,
        el('span',{className:'crit-arrow',style:{color:'#94a3b8',fontSize:'13px'}},isOpen?'▲':'▼')
      )
    );
    block.appendChild(header);

    const body=el('div',{className:'crit-body'});

    // Logboek geheugensteun
    if(hints.length){
      const hintDiv=el('div',{className:'logboek-hint'});
      hintDiv.appendChild(el('strong',{},'📋 Wat je eerder hebt geregistreerd'));
      hints.slice(0,6).forEach(h=>{
        const icon=h.antwoord===true?'✓':h.antwoord===false?'✗':'—';
        const clr=h.antwoord===true?'#15803d':h.antwoord===false?'#b91c1c':'#64748b';
        hintDiv.appendChild(el('div',{style:{marginTop:'4px',color:clr}},`${icon} [${h.datum.split(' ').slice(-2).join(' ')}] ${h.vraag}`));
      });
      if(hints.length>6)hintDiv.appendChild(el('div',{style:{color:'#94a3b8',marginTop:'4px',fontSize:'11px'}},`+${hints.length-6} meer geregistreerd`));
      body.appendChild(hintDiv);
    }

    crit.stellingen.forEach((stelling,si)=>{
      const huidig=scores[stelling.id];
      const sdiv=el('div',{className:'stelling'+(si===0?' stelling-first':'')});
      sdiv.appendChild(el('div',{className:'stelling-vraag'},stelling.vraag));
      const opties=el('div',{className:'opties'});
      [4,3,2,1].forEach((score,idx)=>{
        const btn=el('button',{
          className:`optie-btn n${score}`+(huidig===score?' selected':''),
          onClick:()=>{
            const ns={...scores,[stelling.id]:huidig===score?undefined:score};
            if(huidig===score)delete ns[stelling.id];
            updateDuo(duo.id,{scores:ns});
          }
        },el('span',{className:'niv'},NIVEAUS[score]),stelling.opties[idx]);
        opties.appendChild(btn);
      });
      sdiv.appendChild(opties);
      body.appendChild(sdiv);
    });

    if(punten){
      body.appendChild(el('div',{className:'crit-summary',style:{background:niv.color+'10',border:`1px solid ${niv.color}30`}},
        el('span',{style:{color:'#64748b'}},`Gemiddelde van ${ingevuld} stelling${ingevuld!==1?'en':''}`),
        el('span',{style:{fontWeight:'800',color:niv.color}},`${niv.label} · ${punten}p · bijdrage: ${(punten*crit.weging).toFixed(1)}p`)
      ));
    }

    const opLabel=el('div',{className:'opmerking-label'},`Opmerkingen – ${crit.label}`);
    const opInput=el('textarea',{className:'opmerking-input',placeholder:`Notities over ${crit.label.toLowerCase()}...`});
    opInput.value=opmerkingen[crit.id]||'';
    opInput.addEventListener('input',e=>{
      const d=getActive();if(!d)return;
      const no={...(d.opmerkingen||{}),[crit.id]:e.target.value};
      updateDuoSilent(d.id,{opmerkingen:no});
    });
    body.appendChild(opLabel);
    body.appendChild(opInput);
    block.appendChild(body);
    wrap.appendChild(block);
  });
  return wrap;
}

      el('td',{style:{color:'#7c3aed',fontWeight:'700',textAlign:'right'}},`${presGem2}/10`)
    ));

  tbody.appendChild(el('tr',{className:'totaal'},el('td',{colspan:'4'},'Eindcijfer (verslag + proces)'),el('td',{style:{color:scClr,fontSize:'17px'}},cijfer||'—')));
  tbl.appendChild(tbody);

// ══ PRESENTATIE TAB ══
function renderPresentatieTab(duo){
  const presScores=duo.presScores||{};
  const presOpm=duo.presOpmerkingen||{};

  // Totaalscore berekenen (gewogen gemiddeld op 10)
  let totaal=0,wegTot=0;
  PRES_RUBRIC.forEach(c=>{
    const s=presScores[c.id];
    if(s!=null){totaal+=s*(c.weging/100);wegTot+=c.weging/100;}
  });
  const presGem=wegTot>0?(totaal/wegTot).toFixed(1):null;

  const wrap=el('div',{});

  // Intro
  wrap.appendChild(el('div',{style:{fontSize:'13px',color:'#6b7280',marginBottom:'16px',padding:'10px 14px',background:'#faf5ff',border:'1px solid #e9d5ff',borderRadius:'8px'}},
    '📊 Beoordeel elke categorie via de 6-puntsschaal (2/4/6/7/8/10). De gewogen totaalscore wordt automatisch berekend. Presentatie telt voor 25% mee in de eindcijferberekening.'
  ));

  // Totaalscore box
  const totBox=el('div',{className:'pres-totaal'},
    el('div',{style:{flex:'1'}},
      el('div',{style:{fontSize:'13px',color:'#64748b',marginBottom:'2px'}},'Gewogen totaalscore presentatie'),
      el('div',{style:{fontSize:'12px',color:'#94a3b8'}},`${PRES_RUBRIC.filter(c=>presScores[c.id]!=null).length} van ${PRES_RUBRIC.length} criteria beoordeeld`)
    ),
    el('div',{style:{textAlign:'right'}},
      presGem
        ?[el('div',{className:'pres-totaal-getal'},presGem),el('div',{style:{fontSize:'11px',color:'#7c3aed',fontWeight:'700'}},'/ 10')]
        :el('div',{style:{fontSize:'14px',color:'#94a3b8'}},'—')
    )
  );
  wrap.appendChild(totBox);

  // Per criterium
  PRES_RUBRIC.forEach(crit=>{
    const cur=presScores[crit.id];
    const isOpen=state.openItem===('pres_'+crit.id);
    const block=el('div',{className:'pres-crit'+(isOpen?' open':'')});

    const header=el('div',{className:'pres-crit-header',onClick:()=>setState({openItem:isOpen?null:('pres_'+crit.id)})},
      el('div',{style:{flex:'1'}},
        el('span',{style:{fontWeight:'700',fontSize:'14px',color:'#1e3a5f'}},crit.label),
        el('span',{style:{fontSize:'12px',color:'#94a3b8',marginLeft:'6px'}},`${crit.weging}%`)
      ),
      cur!=null?el('span',{style:{fontWeight:'800',fontSize:'15px',color:'#7c3aed',marginRight:'8px'}},`${cur} / 10`):null,
      el('span',{style:{color:'#94a3b8',fontSize:'13px'}},isOpen?'▲':'▼')
    );
    block.appendChild(header);

    const body=el('div',{className:'pres-crit-body'});
    const grid=el('div',{className:'pres-score-grid'});

    [[2,'Laag'],[4,'Laag+'],[6,'Gemiddeld'],[7,'Gem.+'],[8,'Hoog'],[10,'Excellent']].forEach(([score,lbl])=>{
      const desc=crit.niveaus[score]||'';
      const isSelected=cur===score;
      const btn=el('button',{
        className:`pres-score-btn p${score}${isSelected?' selected':''}`,
        onClick:()=>{
          const newV=cur===score?null:score;
          const ns={...presScores,[crit.id]:newV};
          if(newV===null)delete ns[crit.id];
          updateDuo(duo.id,{presScores:ns});
        }
      },
        el('span',{className:'ps-nr'},String(score)),
        el('span',{className:'ps-lbl'},lbl),
        desc?el('span',{className:'ps-desc'},desc):null
      );
      grid.appendChild(btn);
    });
    body.appendChild(grid);

    // Opmerking
    body.appendChild(el('div',{className:'opmerking-label'},`Opmerkingen – ${crit.label}`));
    const ta=el('textarea',{className:'opmerking-input',placeholder:`Notities over ${crit.label.toLowerCase()}...`});
    ta.value=presOpm[crit.id]||'';
    ta.addEventListener('input',e=>{
      const d=getActive();if(!d)return;
      const no={...(d.presOpmerkingen||{}),[crit.id]:e.target.value};
      updateDuoSilent(d.id,{presOpmerkingen:no});
    });
    body.appendChild(ta);
    block.appendChild(body);
    wrap.appendChild(block);
  });

  return wrap;
}

    body.appendChild(el('div',{style:{fontSize:'12px',color:'#64748b',marginBottom:'10px'}},'Klik op een vraag om hem als "gesteld" te markeren.'));

    data.vragen.forEach((vraag,i)=>{
      const key=`vd_${cat}_${i}`;
      const gebruikt=!!(state.gesteldVragen||{})[key];
      const vDiv=el('div',{
        className:'vd-vraag'+(gebruikt?' gebruikt':''),
        onClick:()=>{
          const gv={...(state.gesteldVragen||{}),[key]:!gebruikt};
          setState({gesteldVragen:gv});
        }
      },
        el('span',{className:'vd-vraag-nr'},`${i+1}.`),
        el('span',{},vraag),
        gebruikt?el('span',{style:{marginLeft:'auto',flexShrink:'0',fontSize:'16px'}},'✓'):null
      );
      body.appendChild(vDiv);
    });

    block.appendChild(body);
    wrap.appendChild(block);
  });

  return wrap;
}

// ══ PRINT VENSTER GENERATOR ══
function generatePrintWindow(duo) {
  const scores     = duo.scores        || {};
  const opmerkingen= duo.opmerkingen   || {};
  const presScores = duo.presScores    || {};
  const presOpm    = duo.presOpmerkingen || {};
  const logboek    = duo.logboek       || {};

  const NIV_LABELS = ['','Laag','Gemiddeld','Hoog','Excellent'];
  const NIV_COLORS = ['','#c0392b','#e07b2a','#3a9e5e','#1a6b3c'];
  const SCALE_LABELS = {4:'Uitstekend',3:'Goed',2:'Matig',1:'Onvoldoende'};
  const SCALE_COLORS = {4:'#1a6b3c',3:'#3a9e5e',2:'#e07b2a',1:'#c0392b'};
  const SCALE_BG     = {4:'#ecfdf5',3:'#f0fdf4',2:'#fff3e0',1:'#fee2e2'};
  const PRES_COLORS  = {2:'#c0392b',4:'#e07b2a',6:'#d97706',7:'#3a9e5e',8:'#1a6b3c',10:'#7c3aed'};
  const PRES_LBLS    = {2:'Laag',4:'Laag+',6:'Gemiddeld',7:'Gem.+',8:'Hoog',10:'Excellent'};

  function critScoreLocal(critId) {
    var c = RUBRIC.find(function(r){return r.id===critId;});
    if (!c) return null;
    var v = c.stellingen.map(function(s){return scores[s.id];}).filter(function(x){return x!=null;});
    if (!v.length) return null;
    var gem = v.reduce(function(a,b){return a+b;},0)/v.length;
    return Math.round(((gem-1)/3)*60+10);
  }

  function niveauLabelLocal(p) {
    if (p>=65) return {label:'Excellent', color:'#1a6b3c'};
    if (p>=55) return {label:'Hoog+',     color:'#2d8a50'};
    if (p>=45) return {label:'Hoog',      color:'#3a9e5e'};
    if (p>=38) return {label:'Gem.+',     color:'#c07a1a'};
    if (p>=28) return {label:'Gemiddeld', color:'#e07b2a'};
    if (p>=18) return {label:'Laag+',     color:'#c0392b'};
    return             {label:'Laag',     color:'#922b21'};
  }

  // Eindcijfer
  var gewP=0, totW=0;
  RUBRIC.forEach(function(c){ var p=critScoreLocal(c.id); if(p!=null){gewP+=p*c.weging;totW+=c.weging;} });
  var eindcijferVal = totW>0 ? Math.min(10,Math.max(1,((gewP-10)/60)*9+1)).toFixed(1) : null;

  // Presentatiescore
  var presTot=0, presW=0;
  PRES_RUBRIC.forEach(function(c){ var s=presScores[c.id]; if(s!=null){presTot+=s*(c.weging/100);presW+=c.weging/100;} });
  var presGemVal = presW>0 ? (presTot/presW).toFixed(1) : null;

  var datum = new Date().toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'});

  // ── HTML bouwen via string concatenatie (geen nested template literals) ──
  function q(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // SCOREOVERZICHT RIJEN
  var sumRijen = '';
  RUBRIC.forEach(function(c){
    var p = critScoreLocal(c.id);
    var niv = p ? niveauLabelLocal(p) : null;
    sumRijen += '<tr>';
    sumRijen += '<td>' + q(c.label) + '</td>';
    sumRijen += '<td style="text-align:center;' + (niv?'color:'+niv.color+';font-weight:700':'') + '">' + (niv?q(niv.label):'—') + '</td>';
    sumRijen += '<td style="text-align:center">' + (p||'—') + '</td>';
    sumRijen += '<td style="text-align:center">' + Math.round(c.weging*100) + '%</td>';
    sumRijen += '<td style="text-align:right;font-weight:700">' + (p?(p*c.weging).toFixed(1):'—') + '</td>';
    sumRijen += '</tr>';
  });
  if(presGemVal){
    sumRijen += '<tr style="background:#faf5ff">';
    sumRijen += '<td style="color:#7c3aed;font-style:italic">Presentatie (apart beoordeeld)</td>';
    sumRijen += '<td style="text-align:center">—</td>';
    sumRijen += '<td style="text-align:center;color:#7c3aed;font-weight:700">' + presGemVal + '/10</td>';
    sumRijen += '<td style="text-align:center">25%</td>';
    sumRijen += '<td style="text-align:right;color:#7c3aed;font-weight:700">—</td>';
    sumRijen += '</tr>';
  }
  sumRijen += '<tr class="totaal-rij"><td colspan="4">Eindcijfer (verslag + proces)</td><td>' + (eindcijferVal||'—') + '</td></tr>';

  // EINDSCORE BOX
  var eindscoreBox = '';
  if(eindcijferVal){
    var eClr = parseFloat(eindcijferVal)>=7.5?'#1a6b3c':parseFloat(eindcijferVal)>=5.5?'#e07b2a':'#c0392b';
    eindscoreBox = '<div class="eindscore-box" style="border-color:'+eClr+';background:'+eClr+'12">'
      + '<div class="eindscore-getal" style="color:'+eClr+'">' + eindcijferVal + '</div>'
      + '<div class="eindscore-meta">'
      + '<div class="lbl">Eindcijfer profielwerkstuk</div>'
      + '<div class="sub">Berekend op basis van gewogen gemiddelde van alle rubriccriteria</div>'
      + (presGemVal?'<div class="sub" style="margin-top:4px;color:#7c3aed">Presentatiescore: '+presGemVal+'/10 (apart beoordeeld)</div>':'')
      + '</div></div>';
  }

  // RUBRIC SECTIE — alleen totaalscore per criterium + opmerking
  var rubricHTML = '';
  RUBRIC.forEach(function(c){
    var p = critScoreLocal(c.id);
    var niv = p ? niveauLabelLocal(p) : null;
    var opm = opmerkingen[c.id] || '';
    rubricHTML += '<div class="crit-row">';
    rubricHTML += '<div class="crit-row-header">';
    rubricHTML += '<span class="crit-naam">' + q(c.label) + '</span>';
    rubricHTML += '<span class="crit-weg">' + Math.round(c.weging*100) + '%</span>';
    if(p){
      rubricHTML += '<span class="crit-score" style="color:'+niv.color+';border-color:'+niv.color+'">' + q(niv.label) + ' &middot; ' + p + 'p</span>';
    } else {
      rubricHTML += '<span class="crit-score-leeg">Niet ingevuld</span>';
    }
    rubricHTML += '</div>';
    if(opm){ rubricHTML += '<div class="opm-row"><em>Opmerking:</em> ' + q(opm) + '</div>'; }
    rubricHTML += '</div>';
  });

  // PRESENTATIE DETAIL SECTIE
  var presHTML = '';
  if(!presW){
    presHTML = '<p style="color:#94a3b8;font-style:italic">Presentatie nog niet beoordeeld.</p>';
  } else {
    presHTML += '<div class="pres-totaal-print">Gewogen presentatiescore: <strong>' + presGemVal + ' / 10</strong></div>';
    PRES_RUBRIC.forEach(function(c){
      var s = presScores[c.id];
      var opm = presOpm[c.id] || '';
      if(s==null && !opm) return;
      var clr = s ? (PRES_COLORS[s]||'#374151') : '#94a3b8';
      var lbl = s ? (PRES_LBLS[s]||'') : '';
      presHTML += '<div class="crit-row">';
      presHTML += '<div class="crit-row-header">';
      presHTML += '<span class="crit-naam">' + q(c.label) + '</span>';
      presHTML += '<span class="crit-weg">' + c.weging + '%</span>';
      if(s!=null){
        presHTML += '<span class="crit-score" style="color:'+clr+';border-color:'+clr+'">' + lbl + ' &middot; ' + s + '/10</span>';
      } else {
        presHTML += '<span class="crit-score-leeg">Niet ingevuld</span>';
      }
      presHTML += '</div>';
      if(s!=null && c.niveaus[s]){
        presHTML += '<div class="stelling-row"><span class="st-a" style="color:'+clr+'">&#9658; ' + q(c.niveaus[s]) + '</span></div>';
      }
      if(opm){ presHTML += '<div class="opm-row"><em>Opmerking:</em> ' + q(opm) + '</div>'; }
      presHTML += '</div>';
    });
  }

  // LOGBOEK SECTIE
  var logHTML = '';
  var heeftLogData = false;
  MIJLPALEN.forEach(function(m){
    if(m.id==='presentatie') return;
    var mData = logboek[m.id] || {};
    var ingevulde = m.vragen.filter(function(v){ return mData[v.id]!==undefined && mData[v.id]!=='' && mData[v.id]!==null; });
    if(!ingevulde.length) return;
    heeftLogData = true;
    logHTML += '<div class="log-mijlpaal">';
    logHTML += '<div class="log-m-titel">' + q(m.titel) + ' <span class="log-m-datum">' + q(m.datum) + '</span></div>';
    ingevulde.forEach(function(v){
      var val = mData[v.id];
      logHTML += '<div class="log-vraag">';
      logHTML += '<span class="log-q">' + q(v.tekst) + '</span>';
      if(v.type==='text'){
        logHTML += '<div class="log-notitie">' + q(val) + '</div>';
      } else if(v.type==='bool'){
        var kleur = val===true?'#15803d':'#b91c1c';
        var icon  = val===true?'&#10003; Ja':'&#10007; Nee';
        logHTML += '<span class="log-bool" style="color:'+kleur+';font-weight:700">' + icon + '</span>';
      } else if(v.type==='scale'){
        if(val==null){ logHTML += '</div>'; return; }
        var slbl = SCALE_LABELS[val]||val;
        var sclr = SCALE_COLORS[val]||'#374151';
        var sbg  = SCALE_BG[val]||'#f8fafc';
        var desc = v.schaal ? (v.schaal[val-1]||'') : '';
        logHTML += '<span class="log-scale" style="color:'+sclr+';background:'+sbg+';border:1px solid '+sclr+'">'+val+' – '+slbl+': '+q(desc)+'</span>';
      }
      logHTML += '</div>';
    });
    logHTML += '</div>';
  });
  if(!heeftLogData){ logHTML = '<p style="color:#94a3b8;font-style:italic">Geen logboekdata ingevuld.</p>'; }

  // ── LOGO (inline) ──
  var logoSrc = document.querySelector('.topbar-logo img') ? document.querySelector('.topbar-logo img').src : '';

  // ── VOLLEDIGE HTML SAMENSTELLEN ──
  var html = '<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8">';
  html += '<title>PWS Beoordelingsformulier \u2013 ' + q(duo.naam) + '</title>';
  html += '<style>';
  html += '*{box-sizing:border-box;margin:0;padding:0}';
  html += 'body{font-family:Arial,Helvetica,sans-serif;font-size:10pt;color:#1e293b;background:#fff}';
  html += '@page{size:A4;margin:15mm 15mm 18mm 15mm}';
  html += '.doc-header{display:flex;align-items:flex-start;gap:16px;border-bottom:3px solid #1e3a5f;padding-bottom:12px;margin-bottom:16px}';
  html += '.doc-header img{height:46px;width:auto}';
  html += '.doc-header h1{font-size:14pt;font-weight:900;color:#1e3a5f}';
  html += '.doc-header .school{font-size:9pt;color:#555;margin-top:2px;font-style:italic}';
  html += '.doc-header .datum{font-size:9pt;color:#94a3b8;margin-top:2px}';
  html += '.info-tabel{width:100%;border-collapse:collapse;margin-bottom:16px}';
  html += '.info-tabel td{padding:5px 8px;border:1px solid #e2e8f0;font-size:9.5pt}';
  html += '.info-tabel td:first-child{font-weight:700;color:#64748b;width:110px;background:#f8fafc}';
  html += '.sectie-kop{font-size:10.5pt;font-weight:900;color:#1e3a5f;background:#e8eef7;padding:6px 12px;border-left:4px solid #1e3a5f;margin:16px 0 9px;page-break-after:avoid}';
  html += '.sectie-kop.paars{background:#f5f3ff;border-color:#7c3aed;color:#5b21b6}';
  html += '.sectie-kop.groen{background:#f0fdf4;border-color:#059669;color:#065f46}';
  html += '.crit-row{border:1px solid #e2e8f0;border-radius:4px;margin-bottom:7px;overflow:hidden;page-break-inside:avoid}';
  html += '.crit-row-header{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#f8fafc}';
  html += '.crit-naam{font-weight:700;font-size:9.5pt;color:#1e3a5f;flex:1}';
  html += '.crit-weg{font-size:8pt;color:#94a3b8}';
  html += '.crit-score{font-size:8.5pt;font-weight:800;padding:2px 8px;border-radius:12px;border:1.5px solid}';
  html += '.crit-score-leeg{font-size:8.5pt;color:#94a3b8;font-style:italic}';
  html += '.stelling-row{padding:4px 10px 4px 18px;border-top:1px solid #f1f5f9;display:flex;gap:8px;flex-wrap:wrap}';
  html += '.st-q{font-size:8.5pt;color:#64748b;flex:1;min-width:150px}';
  html += '.st-a{font-size:8.5pt;font-weight:600}';
  html += '.opm-row{padding:5px 10px 6px 18px;border-top:1px solid #f1f5f9;font-size:8.5pt;color:#374151;background:#fffbeb}';
  html += '.eindscore-box{border:2.5px solid #1a6b3c;border-radius:8px;padding:14px 18px;display:flex;align-items:center;gap:18px;margin:14px 0}';
  html += '.eindscore-getal{font-size:38pt;font-weight:900;line-height:1}';
  html += '.eindscore-meta .lbl{font-size:9pt;color:#64748b}';
  html += '.eindscore-meta .sub{font-size:8pt;color:#94a3b8;margin-top:3px}';
  html += '.sum-tabel{width:100%;border-collapse:collapse;margin:8px 0 16px;font-size:9pt}';
  html += '.sum-tabel th{background:#1e3a5f;color:#fff;padding:6px 8px;text-align:left}';
  html += '.sum-tabel th:not(:first-child){text-align:center}';
  html += '.sum-tabel th:last-child{text-align:right}';
  html += '.sum-tabel td{padding:5px 8px;border-bottom:1px solid #f1f5f9}';
  html += '.sum-tabel td:not(:first-child){text-align:center}';
  html += '.sum-tabel td:last-child{text-align:right;font-weight:700}';
  html += '.totaal-rij{background:#f0fdf4;border-top:2px solid #1a6b3c}';
  html += '.totaal-rij td{font-weight:900;font-size:11pt;color:#1a6b3c}';
  html += '.pres-totaal-print{font-size:9.5pt;font-weight:700;color:#7c3aed;background:#faf5ff;border:1.5px solid #7c3aed;border-radius:6px;padding:7px 12px;margin-bottom:9px}';
  html += '.log-mijlpaal{margin-bottom:10px;border:1px solid #e2e8f0;border-radius:4px;overflow:hidden;page-break-inside:avoid}';
  html += '.log-m-titel{font-weight:700;font-size:9pt;color:#1e3a5f;background:#f0f4ff;padding:5px 10px;display:flex;justify-content:space-between}';
  html += '.log-m-datum{font-weight:400;color:#94a3b8;font-size:8pt}';
  html += '.log-vraag{padding:3px 10px;border-top:1px solid #f1f5f9;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}';
  html += '.log-q{font-size:8pt;color:#64748b;flex:1;min-width:150px}';
  html += '.log-bool{font-size:8.5pt}';
  html += '.log-scale{font-size:8pt;padding:2px 7px;border-radius:4px}';
  html += '.log-notitie{font-size:8pt;color:#374151;font-style:italic;width:100%}';
  html += '.ht-blok{margin-top:26px;padding-top:14px;border-top:2px solid #e2e8f0;page-break-inside:avoid}';
  html += '.ht-titel{font-size:10.5pt;font-weight:900;color:#1e3a5f;margin-bottom:18px}';
  html += '.ht-rij{display:flex;gap:24px;flex-wrap:wrap}';
  html += '.ht-item{flex:1;min-width:130px}';
  html += '.ht-naam-vak{border:1px solid #e2e8f0;border-radius:4px;padding:4px 8px;min-height:20px;margin-bottom:4px;font-size:8pt;color:#94a3b8}';
  html += '.ht-lijn{border-bottom:1.5px solid #334155;height:50px;margin-bottom:5px}';
  html += '.ht-label{font-size:8.5pt;color:#64748b;font-weight:700}';
  html += '.ht-datum{font-size:8pt;color:#94a3b8;margin-top:2px}';
  html += '.page-break{page-break-before:always}';
  html += '</style></head><body>';

  // HEADER
  html += '<div class="doc-header">';
  if(logoSrc){ html += '<img src="' + logoSrc + '" alt="Sophianum">'; }
  html += '<div><h1>Beoordelingsformulier Profielwerkstuk VWO</h1>';
  html += '<div class="school">Sophianum \u2013 De Scholengemeenschap van het Heuvelland</div>';
  html += '<div class="datum">Schooljaar 2026\u20132027 \u00b7 ' + datum + '</div></div>';
  html += '</div>';

  // LEERLINGINFORMATIE
  html += '<table class="info-tabel">';
  html += '<tr><td>Leerlingen</td><td><strong>' + q(duo.naam) + '</strong></td></tr>';
  html += '<tr><td>Vak</td><td>' + q(duo.vak||'\u2014') + '</td></tr>';
  html += '<tr><td>Titel PWS</td><td><em>' + q(duo.titel||'\u2014') + '</em></td></tr>';
  html += '<tr><td>Begeleider</td><td>&nbsp;</td></tr>';
  html += '</table>';

  // SCOREOVERZICHT
  html += '<div class="sectie-kop">Scoreoverzicht</div>';
  html += '<table class="sum-tabel"><thead><tr>';
  html += '<th>Criterium</th><th>Niveau</th><th>Punten</th><th>Weging</th><th>Bijdrage</th>';
  html += '</tr></thead><tbody>' + sumRijen + '</tbody></table>';
  html += eindscoreBox;

  // PAGINA 2: RUBRIC DETAILS
  html += '<div class="page-break"></div>';
  html += '<div class="sectie-kop">Beoordeling per criterium</div>';
  html += rubricHTML;
  html += '<div class="sectie-kop paars">Presentatiebeoordeling</div>';
  html += presHTML;

  // PAGINA 3: LOGBOEK
  html += '<div class="page-break"></div>';
  html += '<div class="sectie-kop groen">Proceslogboek \u2013 registratie begeleider</div>';
  html += logHTML;

  // HANDTEKENINGEN
  html += '<div class="ht-blok"><div class="ht-titel">Handtekeningen</div><div class="ht-rij">';
  ['Leerling 1','Leerling 2','Begeleider'].forEach(function(lbl){
    html += '<div class="ht-item">';
    html += '<div class="ht-naam-vak">Naam ' + lbl.toLowerCase() + ':</div>';
    html += '<div class="ht-lijn"></div>';
    html += '<div class="ht-label">' + lbl + '</div>';
    html += '<div class="ht-datum">Datum: _______________</div>';
    html += '</div>';
  });
  html += '</div></div>';
  html += '<script>window.onload=function(){window.print();}<\/script>';
  html += '</body></html>';

  // Popup geblokkeerd? Dan blob-URL gebruiken als fallback
  var w = window.open('', '_blank');
  if (w && w.document) {
    w.document.write(html);
    w.document.close();
  } else {
    // Fallback: blob URL in hetzelfde tabblad
    var blob = new Blob([html], {type: 'text/html'});
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href   = url;
    a.target = '_blank';
    a.rel    = 'noopener';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 10000);
  }
}

  else app.appendChild(renderDetail());
